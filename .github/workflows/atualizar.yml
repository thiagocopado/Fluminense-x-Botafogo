name: Atualizar Estatisticas Fluminense x Botafogo

on:
  schedule:
    # Roda toda segunda e quinta às 06h00 (horário de Brasília = 09h00 UTC)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar script de atualizacao
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python atualizar.py

      - name: Salvar dados atualizados no repositorio
        run: |
          git config user.name "Bot Estatisticas"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json
          git diff --staged --quiet || (git commit -m "Atualiza estatisticas automaticamente" && git push)
